
name: CI/CD Pipeline - ProductCatalog API

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  # ===========================================================
  # JOB 1 : Continuous Integration (Build & Unit Tests)
  # ===========================================================
  unit-tests:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Extraction du code source du dépôt
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configuration du SDK .NET
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      # 3. Restauration des dépendances NuGet
      - name: Restore dependencies
        run: dotnet restore src/ProductCatalog.Api/ProductCatalog.Api.csproj

      # 4. Compilation en mode Release
      - name: Build solution
        run: dotnet build src/ProductCatalog.Api/ProductCatalog.Api.csproj --configuration Release --no-restore

      # 5. Exécution des tests unitaires
      - name: Run Unit Tests
        run: >
          dotnet test test/ProductCatalog.Tests/ProductCatalog.Tests.csproj
          --filter "FullyQualifiedName~ProductUnitTests"
          --configuration Release
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=UnitResults.trx"
          --results-directory ./TestResults/UnitTests
  # ==========================================================
  # JOB 2 : Tests d'Intégration avec Service SQL Server
  # ==========================================================
  integration-test:
    name: Integration Tests (SQL Server)
    runs-on: ubuntu-latest
    needs: [unit-tests]  # ne s'exécute que si le job unit-tests a réussi

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
          - 1433:1433
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Password123!"
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Password123!' -C -Q 'SELECT 1'"
          --health-interval 15s
          --health-timeout 5s
          --health-retries 6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'  

      - name: Restore dependencies
        run: dotnet restore test/ProductCatalog.Tests/ProductCatalog.Tests.csproj

      - name: Build tests
        run: dotnet build test/ProductCatalog.Tests/ProductCatalog.Tests.csproj --configuration Release --no-restore

      - name: Run Integration Tests
        env:
          ConnectionStrings__CatalogDbConnection: "Server=localhost,1433;Database=CatalogDB_Test;User Id=sa;Password=Password123!;TrustServerCertificate=True;MultipleActiveResultSets=true"
        run: >
          dotnet test test/ProductCatalog.Tests/ProductCatalog.Tests.csproj
          --no-build
          --configuration Release
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=IntegrationResults.trx"
          --results-directory ./TestResults/IntegrationTests